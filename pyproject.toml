[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "peekaboo-py"
version = "1.0.0"
description = "AI-powered screen capture and GUI automation for Windows and Ubuntu (port of openclaw/Peekaboo)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["automation", "screenshot", "ai", "mcp", "gui", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "click>=8.0",
    "mss>=9.0",
    "Pillow>=10.0",
    "pyautogui>=0.9.54",
    "requests>=2.31",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai    = ["openai>=1.0"]
gemini    = ["google-generativeai>=0.8"]
windows   = ["pygetwindow>=0.0.9"]
all       = [
    "anthropic>=0.40",
    "openai>=1.0",
    "google-generativeai>=0.8",
    "pygetwindow>=0.0.9",
]

[project.scripts]
peekaboo = "peekaboo:cli"

[project.urls]
Homepage   = "https://github.com/YOUR_USERNAME/peekaboo-py"
Repository = "https://github.com/YOUR_USERNAME/peekaboo-py"
Issues     = "https://github.com/YOUR_USERNAME/peekaboo-py/issues"
